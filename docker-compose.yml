services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: frontend:v1.0.0
    container_name: frontend
    restart: always
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8080}
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
